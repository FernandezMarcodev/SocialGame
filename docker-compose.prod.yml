# Override de producción para usar una base de datos gestionada externa
# (Render, Railway, Supabase, Fly, RDS, etc.) sin levantar Postgres local.
#
# Uso:
#   1. Copiá .env.example a .env y completá DATABASE_URL con la URL del proveedor.
#   2. docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# También sirve tal cual en plataformas que corren la imagen directamente:
# definí DATABASE_URL (y las vars de email) como variables de entorno.
# Para Redis en producción, definí REDIS_URL en el entorno (ej. redis://user:pass@host:6379/0)

services:
  # El servicio de Postgres local queda anulado (no hace nada, no consume DB).
  db:
    image: alpine:3.20
    entrypoint: ["true"]

  # Redis local también anulado; usar REDIS_URL del entorno para Redis gestionado.
  redis:
    image: alpine:3.20
    entrypoint: ["true"]

  es10p-api:
    depends_on: []
    environment:
      # En producción la URL completa siempre viene del .env / entorno.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
